<!DOCTYPE html> 
  <html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  .slidecontainer {
    width: 100%;
  }
  
  .slider {
    -webkit-appearance: none;
    width: 100%;
    height: 25px;
    background: #d3d3d3;
    outline: none;
    opacity: 0.7;
    -webkit-transition: .2s;
    transition: opacity .2s;
  }
  
  .slider:hover {
    opacity: 1;
  }
  
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 25px;
    height: 25px;
    background: #04AA6D;
    cursor: pointer;
  }
  
  .slider::-moz-range-thumb {
    width: 25px;
    height: 25px;
    background: #04AA6D;
    cursor: pointer;
  }
  </style>
  </head>
  <body onload = "start()">
  
  <h1 style="text-align:center">LED Board Settings</h1>
  <h5 style="text-align:center">{{ip}}</h5>
  
    <div class="slidecontainer">
      <p>Current Brightness Value: <span id="brightnessValue"></span></p>
      <input type="range" min="1" max="100" value={{sliderValue}} class="slider" name = "tot" id="myRange">
    </div>
    <div>
      <p>Do Timed Brightness Setting</p>
      <input type="checkbox" id="doTimedBrightness" checked>
      <div> 
        <button onclick="addTime()">new time</button>
      </div>
      <div id ="times">
        
        <!-- <input type="time" name="brighen" id="brightenTime">
        <input type="time" name="darken" id="darkenTime"> -->
      </div>
    </div>
  
  <script>
  var slider = document.getElementById("myRange");
  var brightnessOutput = document.getElementById("brightnessValue");
  var doTimedBrightness = document.getElementById("doTimedBrightness");
  brightnessOutput.innerHTML = slider.value;
  document.q
  
  function sendPost(){
    const data = { out: slider.value,
                  timedBrightness: doTimedBrightness.value     
    };

    fetch('/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => console.log(data))
    .catch(error => console.error(error));
  }
  
  function start(){
    // alert("test");
    if (document.getElementById("doTimedBrightness").checked === true) {
      document.getElementById("times").style.visibility = "visible";
    }
    else{
      document.getElementById("times").style.visibility = "hidden";
    }
  };

  doTimedBrightness.onchange = function(){
    if (this.checked == true) {
      document.getElementById("times").style.visibility = "visible";
    }
    else{
      document.getElementById("times").style.visibility = "hidden";
    }
    // var newElem = document.createElement('input');
    // newElem.type = 'time';
    // document.getElementById("times").appendChild(newElem);
    sendPost();
  }  

  slider.onchange = function() {
    brightnessOutput.innerHTML = this.value;

    sendPost();
  }

  // function submitForm(event) {
  //     event.preventDefault();
  //     form.style.display = "none";
  //   }
  // form.addEventListener('submit', submitForm);
  function addTime(){
    const newDiv = document.createElement('div');
    // newDiv.style = "display: inline"
    // newDiv.style.border = '1px solid black';
    // newDiv.style.padding = '10px';
    // newDiv.style.margin = '10px 0';
    
    var newElem = document.createElement('input');
    newElem.type = "time";
    document.getElementById("times").appendChild(newElem);

    const newButton = document.createElement('button');
    newButton.innerHTML = "delete";
    newButton.addEventListener('click',function(){
      newDiv.remove();
      newElem.remove();
    });

    newDiv.appendChild(newButton);
    document.getElementById("times").appendChild(newDiv);
  }

  </script>
  
  </body>
  </html>
